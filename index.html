<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07111F">
<title>Tu Empresa en tus Manos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
:root{--gold:#E9C46A;--text:#EEF2F7;--gray:#8FA0B8;--red:#FF7A7A;--green:#5EE6A0;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09)}
body{font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--text);min-height:100dvh;padding-bottom:120px;overflow-x:hidden;
  background:radial-gradient(900px 500px at 0% -10%,rgba(233,196,106,.14),transparent 60%),radial-gradient(800px 500px at 110% 5%,rgba(59,130,246,.16),transparent 55%),#07111F;background-attachment:fixed}
header{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(7,17,31,.72);border-bottom:1px solid var(--line)}
.brand{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:700;font-style:italic;letter-spacing:.3px;background:linear-gradient(90deg,#FFF0B8,#D4A848 60%,#B8891F);-webkit-background-clip:text;background-clip:text;color:transparent}
main{padding:20px 16px 0;touch-action:pan-y}
#view{transition:opacity .18s,transform .18s}
#view.out-l{opacity:0;transform:translateX(-40px)}
#view.out-r{opacity:0;transform:translateX(40px)}
#view.in-l{animation:inL .35s cubic-bezier(.2,.8,.2,1) both}
#view.in-r{animation:inR .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes inL{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.crumb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-bottom:6px}
.crumb a{color:var(--gold);text-decoration:none}
.ptitle{font-family:'Playfair Display',Georgia,serif;font-size:32px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px;line-height:1.1}
.psub{color:var(--gray);font-size:14px;line-height:1.5;margin-bottom:22px}
tabbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;padding:6px;border-radius:24px;background:rgba(14,28,50,.84);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:9}
tabbar a{flex:1;text-decoration:none;color:var(--gray);padding:9px 2px;font-size:10px;font-weight:600;display:flex;flex-direction:column;gap:3px;align-items:center;border-radius:18px;transition:all .25s}
tabbar a .i{font-size:19px}
tabbar a.on{color:#1A1400;background:linear-gradient(135deg,#FFE48A,#C99A2E);box-shadow:0 6px 18px rgba(233,196,106,.35)}
.pager{text-align:center;font-size:11px;color:var(--gray);margin:18px 0 4px;letter-spacing:.5px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.card h3{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#1C3B6E 0%,#0E1E38 55%,#2B2006 100%);border:1px solid rgba(233,196,106,.25);border-radius:26px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(233,196,106,.28),transparent 70%)}
.eyebrow{font-size:12px;color:var(--gray)}
.name{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:700;margin-top:2px}
.ring-row{display:flex;align-items:center;gap:18px;margin-top:18px;position:relative}
.ring{width:118px;height:118px;transform:rotate(-90deg);flex-shrink:0}
.trk{fill:none;stroke:rgba(255,255,255,.1);stroke-width:9}
.val{fill:none;stroke:url(#gg);stroke-width:9;stroke-linecap:round;stroke-dasharray:276.46;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring-num{font-family:'Playfair Display',Georgia,serif;font-size:36px;font-weight:800}
.ring-num small{font-size:18px;color:var(--gold)}
.lbl{font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--gray);margin-top:4px;line-height:1.4}
.muted{color:var(--gray);font-size:12px;line-height:1.5}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.kl{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:1px}
.kv{font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:700;margin-top:6px;color:var(--gold);font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:10px;height:120px}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bar-v{width:100%;border-radius:10px 10px 5px 5px;background:linear-gradient(180deg,#FFE48A,#B8891F);transition:height .9s cubic-bezier(.2,.8,.2,1);min-height:4px}
.bcol span{font-size:10px;color:var(--gray);text-transform:capitalize}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.qb{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;font-size:12px;font-weight:600;transition:transform .15s}
.qb:active{transform:scale(.96)}
.qb .qi{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,rgba(233,196,106,.25),rgba(233,196,106,.05))}
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:rgba(255,255,255,.035);margin-top:8px;font-size:13px;line-height:1.4;border-left:3px solid var(--gold)}
.todo.warn{border-left-color:var(--red)}
.todo.ok{border-left-color:var(--green)}
.todo .ti{font-size:18px}
.todo .tt{flex:1}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);flex-shrink:0;margin-top:1px}
.step b{font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#FFE48A,#B8891F);color:#1A1400;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:17px;flex-shrink:0}
.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap;display:inline-block}
.pg{background:rgba(94,230,160,.14);color:var(--green)}
.pr{background:rgba(255,122,122,.14);color:var(--red)}
.pa{background:rgba(233,196,106,.15);color:var(--gold)}
.pn{background:rgba(255,255,255,.07);color:var(--gray)}
.x{background:none;border:0;color:var(--gray);font-size:16px;padding:4px 6px;cursor:pointer}
label{display:block;font-size:12px;color:var(--gray);margin:12px 0 6px;font-weight:600}
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,196,106,.12)}
select option{background:#101E33}
.btn{display:block;width:100%;margin-top:14px;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,#FFE48A,#C99A2E);color:#1A1400;font-weight:800;font-size:15px;text-align:center;text-decoration:none;box-shadow:0 10px 24px rgba(233,196,106,.25);transition:transform .15s;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn2{background:rgba(255,255,255,.08);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.sm{display:inline-block;width:auto;margin:0;padding:8px 14px;font-size:12px;border-radius:12px}
.wa{background:linear-gradient(135deg,#34E07A,#1DAA5A);color:#fff;box-shadow:0 6px 16px rgba(37,211,102,.3)}
.empty{text-align:center;padding:24px 10px}
.empty .ei{font-size:44px;margin-bottom:10px}
.empty p{color:var(--gray);font-size:14px;line-height:1.6;margin-bottom:6px}
.seg{display:flex;overflow-x:auto;white-space:nowrap;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:18px;scrollbar-width:none}
.seg a{flex:none;text-align:center;padding:10px;border-radius:12px;color:var(--gray);text-decoration:none;font-weight:700;font-size:13px}
.seg a.on{background:linear-gradient(135deg,#FFE48A,#C99A2E);color:#1A1400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;text-decoration:none;display:flex;flex-direction:column;min-height:132px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile.on{border-color:rgba(233,196,106,.4);background:linear-gradient(160deg,rgba(233,196,106,.12),rgba(255,255,255,.02))}
.tile .ti2{font-size:28px}
.tile .tn{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:16px;margin:auto 0 8px;line-height:1.2}
.tile .tc{font-size:11px;color:var(--gray);margin-bottom:8px}
.res{display:flex;gap:10px;margin-bottom:14px}
.res div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.res b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:17px;color:var(--gold);margin-top:4px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:linear-gradient(90deg,#FFE48A,#C99A2E)}
.res4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.kp b{font-family:'Playfair Display',Georgia,serif;font-size:19px;color:var(--gold);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--gray);margin-bottom:12px}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 0}
.lg.gold{background:linear-gradient(180deg,#FFE48A,#B8891F)}
.lg.gray{background:rgba(143,160,184,.45)}
.chart2{display:flex;align-items:flex-end;gap:5px;height:150px}
.bc2{flex:1;height:100%;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bb{flex:1;width:100%;display:flex;align-items:flex-end;gap:2px}
.bi{flex:1;background:linear-gradient(180deg,#FFE48A,#B8891F);border-radius:4px 4px 2px 2px;transition:height .8s}
.bg{flex:1;background:rgba(143,160,184,.45);border-radius:4px 4px 2px 2px;transition:height .8s}
.bc2 span{font-size:9px;color:var(--gray)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%}
.dot.pos{background:var(--green)}
.dot.neg{background:var(--red)}
.btnrow{display:flex;gap:8px;margin-bottom:14px}
.btnrow a{text-decoration:none;padding:8px 14px;font-size:12px}
.al{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;margin-top:8px;font-size:14px;line-height:1.45;background:rgba(255,255,255,.04)}
.al .ad{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0}
.al.pr .ad{background:var(--red);box-shadow:0 0 10px rgba(255,122,122,.6)}
.al.pa .ad{background:var(--gold);box-shadow:0 0 8px rgba(233,196,106,.5)}
.al.pg .ad{background:var(--green);box-shadow:0 0 8px rgba(94,230,160,.5)}
.al.pn .ad{background:var(--gray)}
.hbs{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:96px 1fr 60px;align-items:center;gap:8px;font-size:12px}
.hb span{color:var(--gray);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:10px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}
.hbt div{height:100%;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.hb b{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.chip.on{background:linear-gradient(135deg,#FFE48A,#C99A2E);color:#1A1400;border-color:transparent;box-shadow:0 6px 16px rgba(233,196,106,.3)}
.stp.sm2{width:40px;height:40px;font-size:18px;border-radius:12px}
.stp{width:60px;height:56px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--gold);font-size:26px;font-weight:700;cursor:pointer;flex-shrink:0}
.srch{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:0 14px}
.srch input{border:0;background:transparent;padding:14px 4px;box-shadow:none}
.srch input:focus{box-shadow:none;border:0}
.pr-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;margin-top:8px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);font-family:inherit;cursor:pointer}
.tbox{max-height:260px;overflow-y:auto;margin-top:6px}
.cobrar-bar{position:fixed;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:20px;background:rgba(10,22,40,.96);border:1px solid rgba(233,196,106,.45);box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:8}
.fml{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--gold);background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.5;word-break:break-word}
.estr{margin-top:10px;padding:8px 0 0 12px;border-left:3px solid var(--gold);font-size:14px;line-height:1.5}
.avatar{position:relative;width:78px;height:78px;border-radius:50%;flex-shrink:0;cursor:pointer;background:linear-gradient(135deg,#1C3B6E,#2B2006);border:2px solid rgba(233,196,106,.7);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar span{font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:800;color:var(--gold)}
.avatar .cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#FFE48A,#C99A2E);display:flex;align-items:center;justify-content:center;font-size:13px;font-style:normal;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.avatar .fpick{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;border-radius:50%;z-index:2;font-size:0}
.avatar .cam{pointer-events:none;z-index:1}
.rep{background:#fff;color:#111;border-radius:14px;padding:16px;font-size:13px;line-height:1.4}
.rep table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:12.5px}
.rep td,.rep th{border-bottom:1px solid #e3e3e3;padding:6px 4px;text-align:left;vertical-align:top}
.rep th{background:#f6f1de}
.rep h2{font-family:Georgia,serif;font-size:16px;margin-top:18px;border-bottom:2px solid #D4AF37;padding-bottom:4px;color:#111;page-break-after:avoid}
.rp-h{display:flex;gap:12px;align-items:center;border-bottom:3px solid #D4AF37;padding-bottom:10px;margin-bottom:6px}
.rp-h img{width:60px;height:60px;border-radius:50%;object-fit:cover}
.rp-t{font-family:Georgia,serif;font-size:22px;font-weight:700}
.rp-s{color:#555;font-size:12px}
.rp-f{font-size:11px;color:#666;margin-top:18px;border-top:1px solid #ddd;padding-top:8px}
@media print{
  @page{size:A4;margin:12mm 12mm 16mm;@bottom-right{content:"Página " counter(page);font-size:9px;color:#666}}
  .noprint{display:none!important}
  html,body{background:#fff!important;color:#000!important;padding:0!important;min-height:0!important}
  body *{visibility:hidden!important;box-shadow:none!important}
  .rep,.rep *{visibility:visible!important}
  .rep{position:relative!important;left:auto!important;top:auto!important;width:100%;margin:0!important;padding:0!important;border-radius:0}
  main,#main,#view,.card{padding:0!important;margin:0!important;transform:none!important;animation:none!important;opacity:1!important;background:none!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important}
  header,tabbar,.cobrar-bar,#toast,.seg,.crumb,.ptitle,.psub,.card h3{display:none!important}
  body{padding:0!important;min-height:0!important;height:auto!important}
}
.rep .aviso{background:#fff3cd;color:#7a5a00;border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:12px}
.rep td.num,.rep th.num{text-align:right;white-space:nowrap}
.rep tr{page-break-inside:avoid}
.rep thead{display:table-header-group}
.rep tr.sec td{background:#f6f1de;font-weight:700;color:#111}
.rep tr.tot td{font-weight:700;border-top:1px solid #111}
.rep .estado{font-size:12px;margin:-4px 0 10px}
.rep .firmas{display:flex;gap:16px;margin-top:44px;page-break-inside:avoid}
.rep .firmas div{flex:1;text-align:center;font-size:11px;color:#333}
.rep .fl{border-top:1px solid #111;height:34px;margin-bottom:6px}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);background:linear-gradient(135deg,#FFE48A,#C99A2E);color:#1A1400;font-weight:700;padding:12px 18px;border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.45);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:99;font-size:14px;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.07s}.d2{animation-delay:.14s}.d3{animation-delay:.21s}
</style>

<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE48A"/><stop offset="1" stop-color="#B8891F"/></linearGradient></defs></svg>
<header><div class="brand">Tu Empresa en tus Manos</div></header>
<main id="main"><div id="view"></div></main>
<tabbar id="tabbar"></tabbar>
<div id="toast"></div>
<script>
const KEY="tuempresa-v1";
const DEF={empresa:{nombre:"",rtn:"",horario:"",meta:0,isv:15},sucursales:[],productos:[],clientes:[],ventas:[],reg:{}};
let S,pendDir=null;
function load(){
  try{S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=JSON.parse(JSON.stringify(DEF))}
  if(Array.isArray(S.ticket))CART=S.ticket;
}
function save(){
  try{const s=JSON.stringify(S);localStorage.setItem(KEY,s);programarSync();if(s.length>3500000)toast("Tus datos ya ocupan mucho espacio. Haz un respaldo en Empresa → Datos.")}
  catch(e){toast("No se pudo guardar. Haz un respaldo en Empresa → Datos.")}
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=n=>{const v=Number(n||0),s="L "+Math.abs(v).toLocaleString("es-HN",{minimumFractionDigits:2,maximumFractionDigits:2});return v<0?"("+s+")":s};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hoy=()=>fmtD(new Date());
const inic=s=>(s||"?").trim().charAt(0).toUpperCase();

const ORDER_KEYS=["direccion","finanzas","ventas","compras","inventario","produccion","logistica","rrhh","marketing","estrategia","servicio","sistemas","legal","sucursales"];
const ORDER=[];
ORDER_KEYS.forEach(k=>{
  if(k==="direccion")ORDER.push("#/inicio");
  else if(k==="ventas"){ORDER.push("#/area/ventas");ORDER.push("#/area/ventas/clientes");}
  else if(k==="inventario")ORDER.push("#/area/inventario");
  else if(k==="sucursales")ORDER.push("#/area/sucursales");
  else ORDER.push("#/area/"+k);
});
ORDER.unshift("#/mapa");ORDER.unshift("#/inicio");
// Inicio aparece una sola vez: quitamos el duplicado de Dirección
const ORDER_UNIQ=[...new Set(ORDER)];

function cnt(k){
  if(k==="inventario")return S.productos.length;
  if(k==="sucursales")return S.sucursales.length;
  if(k==="ventas")return S.ventas.length;
  if(k==="finanzas")return (S.fin||[]).length;
  return (S.reg[k]||[]).length;
}
function checks(){
  const e=S.empresa;
  return [
    ["Nombre de la empresa",!!e.nombre,"Así sale en tus reportes y en tus cobros"],
    ["RTN",!!e.rtn,"Lo necesitas para facturar y declarar"],
    ["Horario",!!e.horario,"Tus clientes sabrán cuándo llegar"],
    ["Meta de ventas al mes",e.meta>0,"Para ver cada día si vas bien"],
    ["Sucursal principal",S.sucursales.length>0,"Dónde vive tu negocio"],
    ["Productos con costo y precio",S.productos.some(p=>p.costo>0&&p.precio>0),"Sin costo no sabemos tu ganancia"],
    ["Stock mínimo en productos",S.productos.some(p=>p.min>0),"Te avisamos antes de quedarte sin"],
    ["Clientes registrados",S.clientes.length>0,"Para cobrar y dar seguimiento"],
    ["Primera venta",S.ventas.length>0,"Empieza a registrar tu día"],
    ["Finanzas registradas",(S.fin||[]).length>0,"Ingresos y gastos fuera de la venta"]
  ];
}
const todayTotal=()=>S.ventas.filter(v=>v.fecha===hoy()).reduce((s,v)=>s+v.total,0);
const monthTotal=()=>S.ventas.filter(v=>v.fecha.slice(0,7)===hoy().slice(0,7)).reduce((s,v)=>s+v.total,0);
const sumReg=(k,fld,f)=>(S.reg[k]||[]).filter(f).reduce((s,x)=>s+(+x.vals[fld]||0),0);
function semana(){
  const out=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=fmtD(d);
    out.push({l:d.toLocaleDateString("es-HN",{weekday:"short"}).replace(".",""),t:S.ventas.filter(v=>v.fecha===k).reduce((s,v)=>s+v.total,0)});
  }
  return out;
}
function waLink(c){
  const msg=`Hola ${c.nombre}, le recordamos su saldo pendiente de ${L(c.saldo)} en ${S.empresa.nombre||"nuestro negocio"}. Gracias.`;
  let t=(c.tel||"").replace(/\D/g,"");
  if(t.length===8)t="504"+t;
  return `https://wa.me/${t}?text=${encodeURIComponent(msg)}`;
}
function acciones(){
  const a=[];
  S.productos.filter(p=>p.min>0&&p.stock<=p.min).forEach(p=>a.push({ic:"⚠️",cls:"warn",h:`Reordena <b>${esc(p.nombre)}</b>`,s:`Quedan ${p.stock}. Tu mínimo es ${p.min}.`}));
  S.clientes.filter(c=>c.saldo>0).forEach(c=>a.push({ic:"💰",cls:"warn",h:`Cobra a <b>${esc(c.nombre)}</b> · ${L(c.saldo)}`,s:`<a class="btn wa sm" target="_blank" href="${waLink(c)}">Enviar cobro por WhatsApp</a>`}));
  S.productos.filter(p=>p.precio>0&&p.costo>0&&(p.precio-p.costo)/p.precio<.15).forEach(p=>a.push({ic:"📉",cls:"warn",h:`Margen bajo en <b>${esc(p.nombre)}</b>`,s:`Te deja ${Math.round((p.precio-p.costo)/p.precio*100)}%. Revisa precio o costo.`}));
  (S.reg.compras||[]).filter(x=>x.vals.Estado==="Pendiente").forEach(x=>a.push({ic:"🛒",cls:"warn",h:`Pago pendiente a <b>${esc(x.vals.Proveedor)}</b>`,s:L(x.vals.Monto)}));
  if(S.empresa.meta>0){const pct=Math.round(monthTotal()/S.empresa.meta*100);a.push({ic:"📈",cls:"ok",h:`Vas al ${pct}% de tu meta`,s:`Te faltan ${L(Math.max(0,S.empresa.meta-monthTotal()))} para llegar este mes.`})}
  return a;
}

// ---- Ventas
function segVentas(sub){return `<div class="seg"><a href="#/area/ventas" class="${sub!=="clientes"?"on":""}">Vender</a><a href="#/area/ventas/clientes" class="${sub==="clientes"?"on":""}">Clientes</a></div>`}
let PER="dia";
const PERS=[["dia","Hoy"],["sem","Semana"],["mes","Mes"],["tres","3 meses"],["anio","Año"]];
function setPer(k){PER=k;render();}
function rangoPer(k){
  const t=new Date(),ini=new Date(t);
  if(k==="sem")ini.setDate(t.getDate()-6);
  else if(k==="mes")ini.setDate(1);
  else if(k==="tres")ini.setMonth(t.getMonth()-2,1);
  else if(k==="anio")ini.setMonth(0,1);
  else if(k!=="dia")ini.setDate(t.getDate());
  return [fmtD(ini),fmtD(t)];
}
function ventasRango(k){const [a,b]=rangoPer(k);return S.ventas.filter(v=>v.fecha>=a&&v.fecha<=b);}
function ultimaVenta(nombre){return S.ventas.filter(v=>v.producto===nombre).reduce((m,v)=>v.fecha>m?v.fecha:m,"");}
function diasDesde(f){
  if(!f)return null;
  const [y,m,d]=f.split("-").map(Number),t=new Date();
  return Math.floor((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(y,m-1,d))/864e5);
}
function tickets(vs){
  const g={};vs.forEach(v=>{const k=v.tk||v.id;(g[k]=g[k]||[]).push(v)});
  return Object.values(g).reverse();
}
function vTicketsList(vs,vacio){
  const tk=tickets(vs);
  return tk.map(a=>`<div class="row"><div style="flex:1;min-width:0"><b>${a.length>1?"Ticket de "+a.length+" productos":esc(a[0].producto)}</b><div class="muted">${a.map(v=>v.cant+" × "+esc(v.producto)).join(", ")} · ${esc(a[0].metodo)} · ${a[0].fecha}</div></div><span class="pill pg">${L(a.reduce((s,v)=>s+v.total,0))}</span></div>`).join("")||`<div class="muted">${vacio}</div>`;
}

    <div class="tbox" style="margin-top:14px">
    ${CART.map(c=>{const p=S.productos.find(x=>x.id===c.id);return p?`<div class="row"><div style="flex:1;min-width:0"><b>${esc(p.nombre)}</b><div class="muted">${L(p.precio)} c/u · ${L(p.precio*c.q)}</div></div><div style="display:flex;align-items:center;gap:6px"><button type="button" class="stp sm2" onclick="cartQ('${c.id}',-1)">−</button><b style="min-width:24px;text-align:center">${c.q}</b><button type="button" class="stp sm2" onclick="cartQ('${c.id}',1)">+</button><button type="button" class="x" onclick="cartDel('${c.id}')">✕</button></div></div>`:""}).join("")||'<div class="muted" style="padding:14px 0">El ticket está vacío. Elige un producto arriba.</div>'}

    <div class="chips">${["Efectivo","Transferencia","Tarjeta","Crédito"].map(m=>`<button type="button" class="chip mbtn ${PAY===m?"on":""}" data-m="${m}" onclick="pickM('${m}')">${m}</button>`).join("")}</div>

}
function vResumenPer(){
  const vs=ventasRango(PER),tot=vs.reduce((s,v)=>s+v.total,0),uds=vs.reduce((s,v)=>s+v.cant,0);
  const sold={};vs.forEach(v=>sold[v.producto]=(sold[v.producto]||0)+v.cant);
  const mx=Math.max(1,...Object.values(sold));
  const ranked=S.productos.map(p=>({n:p.nombre,c:sold[p.nombre]||0,stock:p.stock}));
  const mas=ranked.filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,5);
  const menos=ranked.filter(x=>x.stock>0).sort((a,b)=>a.c-b.c).slice(0,5);
  const sin=S.productos.filter(p=>p.stock>0).map(p=>({n:p.nombre,d:diasDesde(ultimaVenta(p.nombre))})).filter(x=>x.d===null||x.d>30).sort((a,b)=>(b.d===null?9999:b.d)-(a.d===null?9999:a.d));
  const al=sin.map(x=>["pr",`<b>${esc(x.n)}</b> ${x.d===null?"nunca se ha vendido":"lleva "+x.d+" días sin venderse"}.`]);
  return `<section class="card rise d2"><h3>Resumen</h3>
    <div class="chips" style="margin-bottom:14px">${PERS.map(([k,l])=>`<button type="button" class="chip ${PER===k?"on":""}" onclick="setPer('${k}')">${l}</button>`).join("")}</div>

function cartCobrar(){
  if(!CART.length)return toast("Agrega productos al ticket");
  let cliente=null;
  if(PAY==="Crédito"){cliente=S.clientes.find(x=>x.id===CLI);if(!cliente)return toast("Para crédito elige un cliente");}
  const lines=CART.map(c=>({p:S.productos.find(x=>x.id===c.id),q:c.q})).filter(x=>x.p);
  const falta=lines.filter(x=>x.q>x.p.stock);
  if(falta.length&&!confirm("Hay productos sin stock suficiente ("+falta.map(x=>x.p.nombre).join(", ")+"). ¿Registrar igual?"))return;
  const tk=uid(),isv=S.empresa.isv||0;
  let total=0;
  lines.forEach(({p,q})=>{
    const t=Math.round(p.precio*q*(1+isv/100)*100)/100;
    total+=t;p.stock-=q;
    S.ventas.push({id:uid(),tk,fecha:hoy(),producto:p.nombre,cant:q,total:t,metodo:PAY,cliente:cliente?cliente.id:"",cogs:p.costo*q,isvm:Math.round((t-t/(1+isv/100))*100)/100});
  });
  if(cliente)cliente.saldo=(cliente.saldo||0)+total;

}

const varPct=(a,b)=>b?(a-b)/b*100:null;
function semVar(v){
  if(v===null)return["pn","Sin dato previo"];

function vResumen(){
  const ym=hoy().slice(0,7),pm=prevYM(ym);
  const ing=ingreso(ym),gas=gasto(ym),ut=ing-gas,mg=ing?Math.round(ut/ing*100):0;
  const vI=varPct(ing,ingreso(pm)),meta=S.empresa.meta,mp=meta?Math.round(ing/meta*100):null;
  const [cI,tI]=semVar(vI),[cM,tM]=semMeta(mp);
  const cG=ing===0?"pn":gas<=ing*.8?"pg":gas<=ing?"pa":"pr";
  let msg;
  if(!ing&&!gas)msg="Aún no hay movimientos este mes. Registra tus ventas y gastos para ver cómo vas.";
  else if(ut<0)msg="Este mes gastas más de lo que entra. Revisa abajo tus gastos más altos y decide cuál recortar primero.";
  else if(vI!==null&&vI<-10)msg="Tus ingresos bajaron más de 10% frente al mes pasado. Toca actuar: revisa precios, clientes que dejaron de comprar y stock.";
  else if(mp!==null&&mp>=100)msg="¡Meta cumplida! Es buen momento para subir la meta del próximo mes.";

// ---- Contabilidad: balance general, flujo de caja y estado de resultados (automáticos)
const B=()=>S.bal||{};
const ABO=()=>S.abonos||[];
const COMP=()=>S.reg.compras||[];
const cFecha=x=>x.vals.Fecha||"";
const esISVPago=x=>x.tipo==="Gasto"&&x.cat==="Pago de ISV";
const ISVr=()=>(S.empresa.isv||0)/(100+(S.empresa.isv||0));
const ventasNetas=v=>v.isvm!==undefined?v.total-v.isvm:v.total*(1-ISVr());
const costoV=v=>v.cogs!==undefined?v.cogs:((S.productos.find(p=>p.nombre===v.producto)||{costo:0}).costo*v.cant);
function flujoMes(ym){
  const cob=S.ventas.filter(v=>v.metodo!=="Crédito"&&v.fecha.slice(0,7)===ym).reduce((s,v)=>s+v.total,0)
    +ABO().filter(a=>a.fecha.slice(0,7)===ym).reduce((s,a)=>s+a.monto,0)
    +FIN().filter(x=>x.tipo==="Ingreso"&&x.fecha.slice(0,7)===ym).reduce((s,x)=>s+x.monto,0);
  const pag=FIN().filter(x=>x.tipo==="Gasto"&&x.fecha.slice(0,7)===ym).reduce((s,x)=>s+x.monto,0)
    +COMP().filter(x=>x.vals.Estado==="Pagado"&&cFecha(x).slice(0,7)===ym).reduce((s,x)=>s+x.vals.Monto,0);
  return {cob,pag,neto:cob-pag};
}
function resMes(ym){
  const vs=S.ventas.filter(v=>v.fecha.slice(0,7)===ym);
  const vn=vs.reduce((s,v)=>s+ventasNetas(v),0);
  const cv=vs.reduce((s,v)=>s+costoV(v),0);
  const fi=FIN().filter(x=>x.tipo==="Ingreso"&&x.fecha.slice(0,7)===ym).reduce((s,x)=>s+x.monto,0);
  const ga=FIN().filter(x=>x.tipo==="Gasto"&&!esISVPago(x)&&x.fecha.slice(0,7)===ym).reduce((s,x)=>s+x.monto,0);
  const co=COMP().filter(x=>cFecha(x).slice(0,7)===ym).reduce((s,x)=>s+x.vals.Monto,0);
  const ing=vn+fi,ub=ing-cv,gs=ga+co;
  return {ing,cv,ub,ga:gs,un:ub-gs};
}
function acumulado(){
  const vn=S.ventas.reduce((s,v)=>s+ventasNetas(v),0);
  const cv=S.ventas.reduce((s,v)=>s+costoV(v),0);
  const fi=FIN().filter(x=>x.tipo==="Ingreso").reduce((s,x)=>s+x.monto,0);
  const ga=FIN().filter(x=>x.tipo==="Gasto"&&!esISVPago(x)).reduce((s,x)=>s+x.monto,0);
  const co=COMP().reduce((s,x)=>s+x.vals.Monto,0);
  return {ing:vn+fi,util:vn+fi-cv-ga-co};
}
function balance(){
  const cobros=S.ventas.filter(v=>v.metodo!=="Crédito").reduce((s,v)=>s+v.total,0)+ABO().reduce((s,a)=>s+a.monto,0)+FIN().filter(x=>x.tipo==="Ingreso").reduce((s,x)=>s+x.monto,0);
  const pagos=FIN().filter(x=>x.tipo==="Gasto").reduce((s,x)=>s+x.monto,0)+COMP().filter(x=>x.vals.Estado==="Pagado").reduce((s,x)=>s+x.vals.Monto,0);
  const caja=(+B().caja0||0)+cobros-pagos;
  const cxc=S.clientes.reduce((s,c)=>s+(c.saldo||0),0);
  const inv=S.productos.reduce((s,p)=>s+p.costo*p.stock,0);
  const af=+B().af||0;
  const act=caja+cxc+inv+af;
  const cxp=COMP().filter(x=>x.vals.Estado==="Pendiente").reduce((s,x)=>s+x.vals.Monto,0);
  const isvP=S.ventas.reduce((s,v)=>s+ISVv(v),0)-FIN().filter(esISVPago).reduce((s,x)=>s+x.monto,0);
  const pre=+B().prest||0;
  const pas=cxp+isvP+pre;
  const cap=+B().capital||0;
  const ut=acumulado().util;
  const dif=(act-pas)-cap-ut;
  return {caja,cxc,inv,af,act,cxp,isvP,pre,pas,cap,ut,dif,pat:cap+ut+dif,corr:caja+cxc+inv,pcorr:cxp+isvP};
}

const colorOpt=o=>POS.test(o)?"#5EE6A0":NEG.test(o)?"#FF7A7A":"#E9C46A";
function hbars(items){
  const mx=Math.max(1,...items.map(x=>x.v));
  return `<div class="hbs">${items.map(x=>`<div class="hb"><span>${esc(x.l)}</span><div class="hbt"><div style="width:${Math.max(3,x.v/mx*100)}%;background:${x.c}"></div></div><b>${x.t!==undefined?x.t:x.v}</b></div>`).join("")||'<div class="muted">Sin datos todavía.</div>'}</div>`;
}
function alertBox(list){return list.map(a=>`<div class="al ${a[0]}"><span class="ad"></span><div>${a[1]}</div></div>`).join("")||'<div class="al pg"><span class="ad"></span><div>Todo en orden.</div></div>'}
function alertasArea(k){
  const r=S.reg[k]||[],A=[],est=x=>x.vals.Estado,cnt=f=>r.filter(f).length;
  if(k==="compras"){const sf=r.filter(x=>!x.vals.Fecha).length;if(sf)A.push(["pa",`${sf} compra(s) sin fecha: no aparecen en los meses. Agrega la fecha.`]);}
  if(k==="compras"){const p=r.filter(x=>est(x)==="Pendiente"),m=p.reduce((s,x)=>s+(+x.vals.Monto||0),0);A.push(p.length?["pr",`Tienes ${p.length} pago(s) pendiente(s) por ${L(m)}.`]:["pg","No debes a proveedores."]);}
  if(k==="produccion"){const n=cnt(x=>est(x)==="En proceso");A.push(n>3?["pr",`${n} procesos abiertos. Revisa dónde se atora.`]:n?["pa",`${n} proceso(s) en curso.`]:["pg","Nada atorado en producción."]);}
  if(k==="logistica"){const n=cnt(x=>est(x)==="Pendiente");A.push(n>2?["pr",`${n} entregas pendientes. Riesgo de quejas.`]:n?["pa",`${n} entrega(s) pendiente(s).`]:["pg","Entregas al día."]);}
  if(k==="rrhh"){const a=cnt(x=>est(x)==="Activo");A.push(a?["pg",`${a} persona(s) activa(s).`]:["pa","Aún no registras personal activo."]);}
  if(k==="marketing"){const inv=r.reduce((s,x)=>s+(+x.vals.Inversion||0),0),vm=monthTotal();A.push(!vm?["pa","Registra ventas para medir si tu inversión rinde."]:inv/vm>.2?["pr",`Inviertes ${Math.round(inv/vm*100)}% de tus ventas del mes en marketing.`]:["pg","Inversión en marketing dentro de rango."]);}
  if(k==="estrategia"){const av=r.length?r.reduce((s,x)=>s+(+x.vals.Avance||0),0)/r.length:null;A.push(av===null?["pa","Define tus objetivos."]:av<25?["pr",`Avance promedio ${Math.round(av)}%. Retoma los objetivos.`]:av<60?["pa",`Avance promedio ${Math.round(av)}%.`]:["pg",`Avance promedio ${Math.round(av)}%. Vas bien.`]);}
  if(k==="servicio"){const n=cnt(x=>est(x)==="Abierto");A.push(n>2?["pr",`${n} casos abiertos sin resolver.`]:n?["pa",`${n} caso(s) abierto(s).`]:["pg","Todos los casos resueltos."]);}
  if(k==="sistemas"){const d=r.map(x=>x.vals.Respaldo).filter(Boolean);const last=d.length?Math.max(...d.map(s=>new Date(s).getTime()||0)):0;const dias=last?Math.floor((Date.now()-last)/864e5):null;A.push(dias===null?["pa","Registra la fecha de tu último respaldo."]:dias>30?["pr",`Tu último respaldo fue hace ${dias} días.`]:["pg",`Respaldo al día (hace ${dias} días).`]);}
  if(k==="legal"){const v=r.map(x=>x.vals.Vence).filter(Boolean).map(s=>Math.floor((new Date(s)-Date.now())/864e5)).filter(d=>!isNaN(d));const pr=v.filter(d=>d<=30),at=v.filter(d=>d>30&&d<=60);A.push(pr.length?["pr",`${pr.length} documento(s) vencen en 30 días o ya vencieron.`]:at.length?["pa",`${at.length} documento(s) vencen en 60 días.`]:["pg",v.length?"Documentos vigentes.":"Registra tus documentos y sus vencimientos."]);}
  if(k==="sucursales")A.push(S.sucursales.length?["pg",`${S.sucursales.length} sucursal(es) registrada(s).`]:["pa","Sin sucursales registradas."]);
  return A;
}
function graficaArea(k){
  const r=S.reg[k]||[],f=AREAS[k].f||[];
  const sel=f.find(x=>x[2]==="s"),num=f.find(x=>x[2]==="n");
  if(sel&&r.length)return `<div class="muted" style="margin-bottom:8px">${sel[1]}</div>${hbars(sel[3].map(o=>({l:o,v:r.filter(x=>x.vals[sel[0]]===o).length,c:colorOpt(o)})))}`;
  if(num&&r.length)return `<div class="muted" style="margin-bottom:8px">${num[1]} por registro</div>${hbars(r.map(x=>({l:x.vals[f[0][0]],v:+x.vals[num[0]]||0,c:"#E9C46A",t:L(x.vals[num[0]])})))}`;
  return `<div class="muted">Cuando registres, aquí verás la gráfica de esta área.</div>`;
}
function vAreaGraf(k){
  return `<section class="card rise d2"><h3>Estado del área</h3>${alertBox(alertasArea(k))}</section>
  <section class="card rise d2"><h3>Gráfica</h3>${graficaArea(k)}</section>`;
}
function vInvAl(){
  const al=[],crit=S.productos.filter(p=>p.min>0&&p.stock<=p.min),marg=S.productos.filter(p=>p.precio>0&&p.costo>0&&(p.precio-p.costo)/p.precio<.15),sc=S.productos.filter(p=>!p.costo||!p.precio);
  crit.forEach(p=>al.push(["pr",`<b>${esc(p.nombre)}</b> está en stock crítico (${p.stock} de mínimo ${p.min}).`]));
  marg.forEach(p=>al.push(["pr",`Margen bajo en <b>${esc(p.nombre)}</b>: ${Math.round((p.precio-p.costo)/p.precio*100)}%.`]));
  if(sc.length)al.push(["pa",`${sc.length} producto(s) sin costo o precio. Sin eso no sabemos tu ganancia.`]);
  const items=S.productos.map(p=>{const c=p.min>0&&p.stock<=p.min?"#FF7A7A":p.min>0&&p.stock<=p.min*1.5?"#E9C46A":"#5EE6A0";return {l:p.nombre,v:p.stock,c,t:p.stock+" uds"}});
  return `<section class="card rise d1"><h3>Estado del inventario</h3>${alertBox(al)}</section>
  <section class="card rise d2"><h3>Stock por producto</h3>${hbars(items)}</section>`;
}
function ventasDias(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=fmtD(d);out.push({k,l:d.getDate(),t:S.ventas.filter(v=>v.fecha===k).reduce((s,v)=>s+v.total,0)})}return out}
function vVentasGraf(){
  const d=ventasDias(14),avg=d.reduce((s,x)=>s+x.t,0)/14,mx=Math.max(1,...d.map(x=>x.t));
  const hoyT=d[13].t,pct=avg?Math.round(hoyT/avg*100):null;
  const wNow=d.slice(7).reduce((s,x)=>s+x.t,0),wPrev=d.slice(0,7).reduce((s,x)=>s+x.t,0),vw=varPct(wNow,wPrev);
  const tot=S.ventas.reduce((s,v)=>s+v.total,0),credit=S.ventas.filter(v=>v.metodo==="Crédito").reduce((s,v)=>s+v.total,0),cp=tot?Math.round(credit/tot*100):0;
  const metods=["Efectivo","Transferencia","Tarjeta","Crédito"].map(m=>({l:m,v:S.ventas.filter(v=>v.metodo===m).reduce((s,v)=>s+v.total,0)}));
  const prod={};S.ventas.forEach(v=>prod[v.producto]=(prod[v.producto]||0)+v.cant);
  const top=Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const recientes=new Set(S.ventas.filter(v=>d.some(x=>x.k===v.fecha)).map(v=>v.producto));
  const dormidos=S.productos.filter(p=>p.stock>0&&!recientes.has(p.nombre)).slice(0,3);
  const al=[];
  if(!S.ventas.length)al.push(["pa","Registra tus primeras ventas para ver las gráficas."]);
  if(pct!==null&&pct<=70)al.push(["pr",`Hoy vas al ${pct}% de tu promedio diario. Activa una promo o contacta a tus clientes.`]);
  else if(pct!==null&&pct>=120)al.push(["pg",`Hoy vas al ${pct}% de tu promedio. ¡Buen día!`]);
  else if(pct!==null)al.push(["pa",`Hoy vas al ${pct}% de tu promedio diario.`]);
  if(vw!==null)al.push([vw<-20?"pr":vw<0?"pa":"pg",`Esta semana vendes ${vw>=0?"+":""}${vw.toFixed(0)}% vs la semana pasada.`]);
  if(cp>40)al.push(["pa",`${cp}% de tus ventas está a crédito. Vigila tus cobros.`]);
  dormidos.forEach(p=>al.push(["pr",`<b>${esc(p.nombre)}</b> no se vende hace 14 días y tiene ${p.stock} en stock.`]));
  return `<section class="card rise d1"><h3>Últimos 14 días</h3>
    <div class="legend"><span><i class="dot pos"></i>Arriba del promedio</span><span><i class="lg gold"></i>Normal</span><span><i class="dot neg"></i>Bajo</span></div>
    <div class="chart2">${d.map(x=>{const c=avg===0?"#E9C46A":x.t>=avg*1.2?"#5EE6A0":x.t<=avg*.7?"#FF7A7A":"#E9C46A";return `<div class="bc2"><div class="bb"><div class="bi" style="height:${Math.max(3,x.t/mx*100)}%;background:${c}"></div></div><span>${x.l}</span></div>`}).join("")}</div>
  </section>
  <section class="card rise d2"><h3>Alertas de ventas</h3>${alertBox(al)}</section>
  <section class="card rise d2"><h3>Cómo pagan tus clientes</h3>${hbars(metods.map(m=>({l:m.l,v:m.v,c:"#E9C46A",t:L(m.v)})))}</section>
  <section class="card rise d3"><h3>Lo que más sale</h3>${hbars(top.map(([l,v])=>({l,v,c:"#5EE6A0",t:v+" uds"})))}</section>`;
}

// ---- Logo de la empresa (se reduce a 256 px para que guarde rápido)
function subirLogo(inp){
  const f=inp.files&&inp.files[0];
  if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{
    const m=256,s=Math.max(m/img.width,m/img.height),sw=m/s,sh=m/s,sx=(img.width-sw)/2,sy=(img.height-sh)/2;
    const c=document.createElement("canvas");c.width=m;c.height=m;
    c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,m,m);
    S.empresa.logo=c.toDataURL("image/jpeg",.9);
    URL.revokeObjectURL(url);save();toast("Logo guardado ✨");render();
  };
  img.onerror=()=>toast("No pude leer esa imagen");
  img.src=url;
  inp.value="";
}
function quitarLogo(){delete S.empresa.logo;save();toast("Logo quitado");render();}

// ---- Estrategia: fórmulas, indicadores con tus números y plan de acción
function indicadores(){
  const ym=hoy().slice(0,7),pm=prevYM(ym),dia=new Date().getDate();
  const m=resMes(ym),pr=resMes(pm),b=balance(),ac=acumulado();
  const vs=S.ventas.filter(v=>v.fecha.slice(0,7)===ym);
  const tk=new Set(vs.map(v=>v.tk||v.id)).size,uds=vs.reduce((s,v)=>s+v.cant,0);
  const tot=vs.reduce((s,v)=>s+v.total,0),cred=vs.filter(v=>v.metodo==="Crédito").reduce((s,v)=>s+v.total,0);
  const mkt=(S.reg.marketing||[]).reduce((s,x)=>s+(+x.vals.Inversion||0),0);
  const cu=uds?vs.reduce((s,v)=>s+(ventasNetas(v)-costoV(v)),0)/uds:0;
  const inv=S.productos.reduce((s,p)=>s+p.costo*p.stock,0);
  const parados=S.productos.filter(p=>p.stock>0).filter(p=>{const d=diasDesde(ultimaVenta(p.nombre));return d===null||d>30}).length;
  const crec=varPct(m.ing,pr.ing),mb=m.ing?m.ub/m.ing*100:null,mn=m.ing?m.un/m.ing*100:null;
  const tp=tk?tot/tk:null,pe=cu>0?m.ga/cu:null,pc=tot?cred/tot*100:null;
  const rot=inv>0&&m.cv>0?(m.cv*12)/inv:null,dias=rot?365/rot:null;
  const liq=b.pcorr?b.corr/b.pcorr:null,acd=b.pcorr?(b.caja+b.cxc)/b.pcorr:null,end=b.act?b.pas/b.act*100:null;
  const roe=b.pat>0?ac.util/b.pat*100:null,roa=b.act>0?ac.util/b.act*100:null;
  const romi=mkt>0?(m.ub-mkt)/mkt*100:null,mpct=m.ing&&mkt?mkt/m.ing*100:null,cpt=tk&&mkt?mkt/tk:null;
  const dso=m.ing?b.cxc/(m.ing/30):null,fl=flujoMes(ym).neto;
  const sem=(v,g,a,inv2)=>v===null?"pn":(inv2?(v<=g?"pg":v<=a?"pa":"pr"):(v>=g?"pg":v>=a?"pa":"pr"));
  const I={ventas:[],marketing:[],finanzas:[]};
  I.ventas.push({n:"Margen bruto",f:"(Ventas netas − Costo de ventas) ÷ Ventas netas",v:mb===null?"—":mb.toFixed(1)+"%",c:sem(mb,35,20),
    t:mb===null?"Aún no hay ventas este mes.":mb>=35?"Buen margen: cada venta deja una ganancia sana.":mb>=20?"Margen aceptable, pero estrecho.":"Margen bajo: cada venta deja muy poco.",
    e:mb!==null&&mb<35?"Sube el precio de tus productos de menor margen o negocia el costo con tu proveedor. Meta: 35%.":"Mantén precios y revisa costos cada mes."});
  I.ventas.push({n:"Ticket promedio",f:"Ventas totales ÷ Número de tickets",v:tp===null?"—":L(tp),c:tp===null?"pn":"pa",
    t:tp===null?"Registra ventas para calcularlo.":`Cada cliente gasta en promedio ${L(tp)} por visita.`,
    e:"Sube el ticket: al cobrar, ofrece un segundo producto complementario."});
  I.ventas.push({n:"Crecimiento de ventas",f:"(Ventas del mes − Ventas del mes anterior) ÷ Ventas del mes anterior",v:crec===null?"—":(crec>=0?"+":"")+crec.toFixed(0)+"%",c:sem(crec,0,-10),
    t:crec===null?"Sin ventas del mes anterior para comparar.":crec>=0?"Tus ventas crecen frente al mes pasado.":"Tus ventas bajan frente al mes pasado.",
    e:crec!==null&&crec<0?"Activa una promo de una semana en tu producto estrella para recuperar clientes.":"Mantén la promo que te funciona."});
  I.ventas.push({n:"Punto de equilibrio",f:"Gastos del mes ÷ Margen de contribución por unidad",v:pe===null?"—":Math.ceil(pe)+" uds",c:pe===null?"pn":(uds>=pe?"pg":"pr"),
    t:pe===null?"Registra ventas y gastos para calcularlo.":uds>=pe?"Ya superaste el punto de equilibrio este mes.":`Te faltan ${Math.ceil(pe-uds)} unidades para no perder dinero.`,
    e:pe!==null?`Meta diaria para cubrir gastos: ${Math.ceil(pe/Math.max(1,dia))} uds al día.`:"Define tus gastos para fijar la meta."});
  I.ventas.push({n:"Ventas a crédito",f:"Ventas a crédito ÷ Ventas totales",v:pc===null?"—":pc.toFixed(0)+"%",c:pc===null?"pn":pc<=25?"pg":pc<=40?"pa":"pr",
    t:pc===null?"Sin ventas este mes.":`${pc.toFixed(0)}% de tus ventas está por cobrar.`,
    e:"Cobra más rápido: recordatorios por WhatsApp desde Clientes y límites de crédito."});
  I.ventas.push({n:"Rotación de inventario",f:"Costo de ventas anual ÷ Valor del inventario (costo × stock)",v:rot===null?"—":rot.toFixed(1)+" veces",c:dias===null?"pn":dias<=30?"pg":dias<=60?"pa":"pr",
    t:dias===null?"Necesitas ventas e inventario para calcularla.":`Tu inventario se renueva cada ${Math.round(dias)} días.`,
    e:dias!==null&&dias>45?"Compra menos de lo que no se mueve y liquida productos parados.":"Buen ritmo: reposiciones pequeñas y frecuentes."});
  I.marketing.push({n:"Inversión en marketing sobre ventas",f:"Inversión en marketing ÷ Ventas del mes",v:mpct===null?"—":mpct.toFixed(1)+"%",c:sem(mpct,10,20,true),
    t:mpct===null?"Registra tu inversión en Marketing para calcularla.":`Gastas ${mpct.toFixed(1)}% de tus ventas en marketing.`,
    e:"Meta: menos de 10% de tus ventas. Pausa lo que no trae ventas."});
  I.marketing.push({n:"Retorno de marketing (estimado)",f:"(Utilidad bruta del mes − Inversión en marketing) ÷ Inversión en marketing",v:romi===null?"—":romi.toFixed(0)+"%",c:sem(romi,100,0),
    t:romi===null?"Registra inversión en Marketing para calcularlo.":romi>=100?"La campaña recupera más de lo que cuesta.":romi>=0?"Recuperas tu inversión, pero con poco margen.":"La inversión no se está recuperando.",
    e:"Regla: por cada L1 invertido, busca al menos L2 de utilidad bruta."});
  I.marketing.push({n:"Costo por ticket",f:"Inversión en marketing ÷ Número de tickets",v:cpt===null?"—":L(cpt),c:cpt===null?"pn":(tp!==null&&cpt<=tp*.2?"pg":"pa"),
    t:cpt===null?"Necesitas inversión y ventas.":`Cada ticket cuesta ${L(cpt)} en marketing.`,
    e:tp!==null?`Compara con el ticket promedio (${L(tp)}): si el costo por ticket es alto, la campaña no paga.`:"Mide cada campaña por ticket."});
  I.marketing.push({n:"Productos parados",f:"Productos con stock sin venta en 30 días",v:parados+"",c:S.productos.filter(p=>p.stock>0).length===0?"pn":parados===0?"pg":parados<=2?"pa":"pr",
    t:parados===0?"No tienes productos parados.":`${parados} producto(s) con stock sin moverse.`,
    e:"Arma un combo o una promo: cada producto parado es dinero inmovilizado."});
  I.finanzas.push({n:"Margen neto",f:"Utilidad neta ÷ Ingresos del mes",v:mn===null?"—":mn.toFixed(1)+"%",c:sem(mn,10,0),
    t:mn===null?"Sin ingresos este mes.":mn>=10?"Margen neto saludable.":mn>=0?"Ganas, pero poco.":"Pierdes dinero este mes.",
    e:mn!==null&&mn<10?"Revisa tus 3 gastos más altos en Finanzas y recorta el que no aporte a ventas.":"Reinvierte parte de la utilidad en lo que más vende."});
  I.finanzas.push({n:"Liquidez corriente",f:"Activo corriente ÷ Pasivo corriente",v:liq===null?"Sin deudas":liq.toFixed(2),c:liq===null?"pn":liq>=1.5?"pg":liq>=1?"pa":"pr",
    t:liq===null?"No tienes deudas de corto plazo.":liq>=1.5?"Puedes pagar tus deudas de corto plazo con holgura.":liq>=1?"Justo: puedes pagar, sin margen.":"No alcanzas a pagar tus deudas corrientes.",
    e:liq!==null&&liq<1?"Cobra cuentas por cobrar y negocia plazos con tus proveedores.":"Mantén tu caja sana."});
  I.finanzas.push({n:"Prueba ácida",f:"(Caja + Cuentas por cobrar) ÷ Pasivo corriente",v:acd===null?"Sin deudas":acd.toFixed(2),c:acd===null?"pn":acd>=1?"pg":acd>=.7?"pa":"pr",
    t:acd===null?"Sin deudas corrientes.":acd>=1?"Cubres deudas corrientes sin vender inventario.":"Dependes de vender inventario para pagar.",
    e:"Convierte inventario en caja: promociones de productos de rotación lenta."});
  I.finanzas.push({n:"Capital de trabajo",f:"Activo corriente − Pasivo corriente",v:L(b.corr-b.pcorr),c:(b.corr===0&&b.pcorr===0)?"pn":b.corr-b.pcorr>=0?"pg":"pr",
    t:b.corr-b.pcorr>=0?"Tienes dinero disponible para operar.":"Tus deudas corrientes superan lo disponible.",
    e:"Mantén un colchón de al menos un mes de gastos fijos."});
  I.finanzas.push({n:"Endeudamiento",f:"Pasivo total ÷ Activo total",v:end===null?"—":end.toFixed(0)+"%",c:sem(end,40,60,true),
    t:end===null?"Sin activos registrados.":end<=40?"Nivel de deuda bajo.":end<=60?"Deuda media: vigílala.":"Deuda alta: tus activos financian poco.",
    e:"No tomes préstamos nuevos hasta bajar de 40%."});
  I.finanzas.push({n:"Retorno sobre activos (ROA)",f:"Utilidad acumulada ÷ Activo total",v:roa===null?"—":roa.toFixed(1)+"%",c:sem(roa,5,0),
    t:roa===null?"Sin activos registrados.":`Cada L100 de activos genera L${roa.toFixed(1)} de utilidad.`,
    e:"Usa mejor tus activos: vende lo que no produce y reinvierte en lo que sí."});
  I.finanzas.push({n:"Retorno sobre patrimonio (ROE)",f:"Utilidad acumulada ÷ Patrimonio",v:roe===null?"—":roe.toFixed(1)+"%",c:sem(roe,10,0),

  I.finanzas.push({n:"Flujo de caja del mes",f:"Cobros del mes − Pagos del mes",v:L(fl),c:fl===0?"pn":fl>=0?"pg":"pr",

    t:dso===null?"Necesitas ventas del mes.":`Tardas unos ${Math.round(dso)} días en cobrar.`,
    e:"Meta: cobrar en 15 días o menos."});
  I.finanzas.push({n:"Balance general (cuadre)",f:"Activo total = Pasivo total + Patrimonio",v:(b.act===0&&b.pas===0&&b.pat===0)?"Sin movimientos":Math.abs(b.dif)<1?"Cuadra":"Diferencia "+L(b.dif),c:(b.act===0&&b.pas===0&&b.pat===0)?"pn":Math.abs(b.dif)<1?"pg":"pr",

  I.all=[...I.ventas,...I.marketing,...I.finanzas];

    const m=e.message||"";
    if(modo==="crear"&&/already|registered|existe/i.test(m))return toast("Ese correo ya tiene cuenta. Toca Entrar.");
    if(modo==="entrar"&&/invalid|credentials|Invalid/i.test(m))return toast("Ese correo no existe o la contraseña no coincide. Si es tu primera vez, toca Crear cuenta. Si ya la creaste, confirma el correo que te llegó.");
    toast(m);
  }
}
function nubeSalir(){clearTimeout(syncT);sesGuardar(null);toast("Sesión cerrada. Tus datos quedan en este celular");render()}

// ---- Enrutamiento
function pageFor(){
  const p=(location.hash||"#/inicio").slice(2).split("/");
  if(p[0]==="mapa")return {html:vMapa(),cur:"mapa"};
  if(p[0]==="area"){
    const k=p[1],sub=p[2];
    if(k==="ventas")return sub==="clientes"?{html:vClientes(),cur:"clientes"}:{html:vVender(),cur:"ventas"};
    if(k==="inventario")return {html:vInventario(),cur:"ventas"};
    if(k==="sucursales")return {html:vSucursales(),cur:"mapa"};
    if(k==="direccion"&&sub==="datos")return {html:vEmpresa(),cur:"inicio"};
    if(k==="estrategia")return {html:vEstrategia(sub),cur:"mapa"};
    if(k==="finanzas")return {html:vFinanzas(sub,p[3]),cur:"mapa"};
    if(AREAS[k]&&AREAS[k].f)return {html:vArea(k),cur:"mapa"};
  }
  return {html:vInicio(),cur:"inicio"};
}
const TABS=[["inicio","#/inicio","🏠","Inicio"],["mapa","#/mapa","🗺️","Mapa"],["ventas","#/area/ventas","🧾","Ventas"],["clientes","#/area/ventas/clientes","👥","Clientes"]];
function render(){
  if(JSON.stringify(S.ticket||[])!==JSON.stringify(CART)){S.ticket=CART;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  const pg=pageFor();
  const v=$("view");
  v.className=pendDir?"in-"+pendDir:"";
  pendDir=null;
  const i=idxOf();
  v.innerHTML=pg.html+`<div class="pager">${i>=0?(i+1)+" / "+ORDER_UNIQ.length+" · desliza ←→":""}</div>`;
  $("tabbar").innerHTML=TABS.map(t=>`<a href="${t[1]}" class="${t[0]===pg.cur?"on":""}"><span class="i">${t[2]}</span>${t[3]}</a>`).join("");
  animar();
}
function idxOf(){const x=location.hash||"#/inicio";let best=-1,bl=0;ORDER_UNIQ.forEach((o,k)=>{if((x===o||x.startsWith(o+"/"))&&o.length>bl){best=k;bl=o.length}});return best<0?0:best}
function goPage(dir){
  const i=idxOf();
  const j=dir==="next"?Math.min(ORDER_UNIQ.length-1,i+1):Math.max(0,i-1);
  if(j===i)return;
  pendDir=dir==="next"?"l":"r";
  const v=$("view");
  v.classList.add(dir==="next"?"out-l":"out-r");
  setTimeout(()=>{location.hash=ORDER_UNIQ[j].slice(1)?ORDER_UNIQ[j]:"#/inicio";},170);
}
// Deslizar con el dedo
let tx=0,ty=0,tt=0;
const mainEl=document.getElementById("main");
mainEl.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now()},{passive:true});
mainEl.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Date.now()-tt>700)return;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;
  if(e.target.closest&&e.target.closest("input,select,textarea"))return;
  goPage(dx<0?"next":"prev");
},{passive:true});
function animar(){
  document.querySelectorAll("[data-count],[data-money]").forEach(el=>{
    const money=el.hasAttribute("data-money");
    const to=+(money?el.dataset.money:el.dataset.count)||0;
    const t0=performance.now();
    const step=t=>{const k=Math.min(1,(t-t0)/1000),v=to*(1-Math.pow(1-k,3));el.textContent=money?L(v):Math.round(v);if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
window.addEventListener("hashchange",()=>{render();window.scrollTo({top:0,behavior:"smooth"});});
load();render();
